# ChatPulse 集群智能聊天服务器 — Docker Compose 编排文件
# 启动全部基础设施: docker compose up -d
# 仅启动基础设施（不含 Agent/Bridge）: docker compose up -d mysql-master mysql-slave1 mysql-slave2 redis ...
# 停止: docker compose down
# 停止并删除数据卷: docker compose down -v

services:
  # ==================== 基础设施层 ====================

  # MySQL 主库（接受写操作）
  mysql-master:
    image: mysql:8.0
    container_name: chat_mysql_master
    environment:
      MYSQL_ROOT_PASSWORD: Sf523416&111
      MYSQL_DATABASE: chat
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpass123
    ports:
      - "3306:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./docker/mysql/master.cnf:/etc/mysql/conf.d/master.cnf
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - chat_network
    restart: unless-stopped
    healthcheck:
      test: mysqladmin ping -h 127.0.0.1 -uroot -p'Sf523416&111'
      interval: 10s
      timeout: 5s
      retries: 5

  # MySQL 从库 1（只读副本）
  mysql-slave1:
    image: mysql:8.0
    container_name: chat_mysql_slave1
    environment:
      MYSQL_ROOT_PASSWORD: Sf523416&111
      MYSQL_DATABASE: chat
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpass123
    ports:
      - "3307:3306"
    volumes:
      - mysql_slave1_data:/var/lib/mysql
      - ./docker/mysql/slave1.cnf:/etc/mysql/conf.d/slave.cnf
    networks:
      - chat_network
    restart: unless-stopped
    depends_on:
      mysql-master:
        condition: service_healthy

  # MySQL 从库 2（只读副本）
  mysql-slave2:
    image: mysql:8.0
    container_name: chat_mysql_slave2
    environment:
      MYSQL_ROOT_PASSWORD: Sf523416&111
      MYSQL_DATABASE: chat
      MYSQL_USER: chatuser
      MYSQL_PASSWORD: chatpass123
    ports:
      - "3308:3306"
    volumes:
      - mysql_slave2_data:/var/lib/mysql
      - ./docker/mysql/slave2.cnf:/etc/mysql/conf.d/slave.cnf
    networks:
      - chat_network
    restart: unless-stopped
    depends_on:
      mysql-master:
        condition: service_healthy

  # Redis 主节点（数据缓存）
  redis:
    image: redis:7-alpine
    container_name: chat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chat_network
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5

  # Redis 从节点 1
  redis-slave1:
    image: redis:7-alpine
    container_name: chat_redis_slave1
    ports:
      - "6380:6379"
    volumes:
      - redis_slave1_data:/data
    command: redis-server --replicaof chat_redis 6379
    depends_on:
      - redis
    networks:
      - chat_network
    restart: unless-stopped

  # Redis 从节点 2
  redis-slave2:
    image: redis:7-alpine
    container_name: chat_redis_slave2
    ports:
      - "6381:6379"
    volumes:
      - redis_slave2_data:/data
    command: redis-server --replicaof chat_redis 6379
    depends_on:
      - redis
    networks:
      - chat_network
    restart: unless-stopped

  # Redis Sentinel 1（高可用监控）
  redis-sentinel1:
    image: redis:7-alpine
    container_name: chat_redis_sentinel1
    ports:
      - "26379:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis
    networks:
      - chat_network
    restart: unless-stopped

  # Redis Sentinel 2
  redis-sentinel2:
    image: redis:7-alpine
    container_name: chat_redis_sentinel2
    ports:
      - "26380:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis
    networks:
      - chat_network
    restart: unless-stopped

  # Redis Sentinel 3
  redis-sentinel3:
    image: redis:7-alpine
    container_name: chat_redis_sentinel3
    ports:
      - "26381:26379"
    volumes:
      - ./docker/redis/sentinel.conf:/usr/local/etc/redis/sentinel.conf
    command: redis-sentinel /usr/local/etc/redis/sentinel.conf
    depends_on:
      - redis
    networks:
      - chat_network
    restart: unless-stopped

  # ZooKeeper（Kafka 依赖）
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: chat_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - chat_network
    restart: unless-stopped

  # Kafka 消息队列（跨服务器消息传递）
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: chat_kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "9093:9093"
    depends_on:
      - zookeeper
    networks:
      - chat_network
    restart: unless-stopped

  # ==================== 服务层 ====================

  # ChatPulse 服务器实例 1（带 MCP AI 接口）
  chat_server_1:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: chat_server_1
    depends_on:
      mysql-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "6000:6000"
      - "8888:8888"
    environment:
      - SERVER_PORT=6000
      - MCP_PORT=8888
      - MYSQL_HOST=mysql-master
      - MYSQL_USER=chatuser
      - MYSQL_PASSWORD=chatpass123
      - MYSQL_DATABASE=chat
      - MYSQL_SLAVES=mysql-slave1:3306,mysql-slave2:3306
      - REDIS_HOST=redis
      - REDIS_SENTINEL1=redis-sentinel1:26379
      - REDIS_SENTINEL2=redis-sentinel2:26379
      - REDIS_SENTINEL3=redis-sentinel3:26379
      - KAFKA_HOST=kafka
    networks:
      - chat_network
    restart: unless-stopped

  # ChatPulse 服务器实例 2
  chat_server_2:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: chat_server_2
    depends_on:
      mysql-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "6001:6001"
      - "8889:8889"
    environment:
      - SERVER_PORT=6001
      - MCP_PORT=8889
      - MYSQL_HOST=mysql-master
      - MYSQL_USER=chatuser
      - MYSQL_PASSWORD=chatpass123
      - MYSQL_DATABASE=chat
      - MYSQL_SLAVES=mysql-slave1:3306,mysql-slave2:3306
      - REDIS_HOST=redis
      - REDIS_SENTINEL1=redis-sentinel1:26379
      - REDIS_SENTINEL2=redis-sentinel2:26379
      - REDIS_SENTINEL3=redis-sentinel3:26379
      - KAFKA_HOST=kafka
    networks:
      - chat_network
    restart: unless-stopped

  # ChatPulse 服务器实例 3
  chat_server_3:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: chat_server_3
    depends_on:
      mysql-master:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "6002:6002"
      - "8890:8890"
    environment:
      - SERVER_PORT=6002
      - MCP_PORT=8890
      - MYSQL_HOST=mysql-master
      - MYSQL_USER=chatuser
      - MYSQL_PASSWORD=chatpass123
      - MYSQL_DATABASE=chat
      - MYSQL_SLAVES=mysql-slave1:3306,mysql-slave2:3306
      - REDIS_HOST=redis
      - REDIS_SENTINEL1=redis-sentinel1:26379
      - REDIS_SENTINEL2=redis-sentinel2:26379
      - REDIS_SENTINEL3=redis-sentinel3:26379
      - KAFKA_HOST=kafka
    networks:
      - chat_network
    restart: unless-stopped

  # Nginx TCP 负载均衡器（将客户端连接分发到 3 个 ChatPulse 实例）
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: chat_nginx
    depends_on:
      - chat_server_1
      - chat_server_2
      - chat_server_3
    ports:
      - "7000:7000"
      - "8080:8080"
    networks:
      - chat_network
    restart: unless-stopped

  # ==================== AI 层 ====================

  # Python Bridge（FastAPI，Web 前端的 REST + WebSocket 入口）
  # 环境变量 SERVER_HOST 和 SERVER_PORT 指定要连接的 ChatPulse 实例
  chat_bridge:
    build:
      context: ./frontend/bridge
      dockerfile: Dockerfile
    container_name: chat_bridge
    depends_on:
      - chat_server_1
    ports:
      - "8000:8000"
    environment:
      - SERVER_HOST=chat_server_1
      - SERVER_PORT=6000
    networks:
      - chat_network
    restart: unless-stopped

  # AI 智能助手（LangChain + LangGraph + ModelScope LLM）
  # 需要设置 MODELSCOPE_API_KEY 环境变量才能正常工作
  # 可通过 .env 文件或 docker compose run 的 -e 参数传入:
  #   docker compose up -d chat_agent -e MODELSCOPE_API_KEY=ms-xxx
  chat_agent:
    build:
      context: ./agent_service
      dockerfile: Dockerfile
    container_name: chat_ai_agent
    depends_on:
      - chat_server_1
    environment:
      - CHAT_SERVER_HOST=chat_server_1
      - CHAT_SERVER_PORT=6000
      - MCP_SERVER_URL=http://chat_server_1:8888/mcp
      - MODELSCOPE_API_KEY=${MODELSCOPE_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    networks:
      - chat_network
    restart: unless-stopped

  # ==================== Web 前端层 ====================

  # ChatPulse Web 前端（React SPA）
  # 构建时可通过 VITE_BRIDGE_URL 参数覆盖 Bridge 地址
  # 默认通过 Nginx 代理 /api/ 和 /ws/ 到 chat_bridge:8000
  chat_web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_BRIDGE_URL: http://127.0.0.1:8000
    container_name: chat_web
    ports:
      - "3000:80"
    depends_on:
      - chat_bridge
    networks:
      - chat_network
    restart: unless-stopped

volumes:
  mysql_master_data:
  mysql_slave1_data:
  mysql_slave2_data:
  redis_data:
  redis_slave1_data:
  redis_slave2_data:

networks:
  chat_network:
    driver: bridge
