# ChatPulse Web Frontend — Nginx 配置
# 提供 React SPA 的静态文件服务，并将 API/WebSocket 请求代理到 Bridge

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 上游 Bridge 服务
    upstream bridge_backend {
        server chat_bridge:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # 静态文件根目录
        root /usr/share/nginx/html;
        index index.html;

        # Gzip 压缩
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
        gzip_min_length 1000;

        # API 请求代理到 Bridge
        location /api/ {
            proxy_pass http://bridge_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 代理
        location /ws/ {
            proxy_pass http://bridge_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # 静态资源（JS/CSS 带 hash）缓存 1 年
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html 不缓存，确保浏览器始终获取最新的 JS/CSS 引用
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # SPA 路由：所有非文件请求返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
